[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorty"
version = "0.1.0"
description = "A small URL shortener"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["shorty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
